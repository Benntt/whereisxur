<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Where Is Xur</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:24px;color:#111827}
    .grid{display:grid;gap:18px}
    .cols{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
    .item{border:1px solid #e5e7eb;border-radius:10px;padding:12px}
    .icon{width:96px;height:96px;border-radius:10px;overflow:hidden;background:#f3f4f6;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
    img{width:100%;height:100%;object-fit:cover;display:block}
    h1{margin:0 0 14px}
    h2{margin:22px 0 10px}
    .muted{color:#6b7280;font-size:12px}
    code{background:#f3f4f6;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <h1>What is Xur Selling This Week?</h1>
  <p class="muted">Data source: <code>/data/xurCurrentInventory.json</code></p>

  <div id="root">Loading…</div>

<script>
(async function () {
  const root = document.getElementById("root");

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function renderItem(item, subtitle) {
    const icon = item.icon ? `<img src="${esc(item.icon)}" alt="${esc(item.name)}">` : "";
    return `
      <div class="item">
        <div class="icon">${icon}</div>
        <div><strong>${esc(item.name)}</strong></div>
        <div class="muted">${esc(subtitle)}</div>
      </div>
    `;
  }

  try {
    const res = await fetch("./data/xurCurrentInventory.json", { cache: "no-store" });
    if (!res.ok) throw new Error("Failed to load current inventory");
    const data = await res.json();

    const hunter = data.exoticArmor?.hunter ?? [];
    const titan = data.exoticArmor?.titan ?? [];
    const warlock = data.exoticArmor?.warlock ?? [];
    const weapons = data.exoticWeapons ?? [];
    const catalysts = data.exoticCatalysts ?? [];

    root.innerHTML = `
      <h2>Exotic Armor</h2>
      <div class="grid cols">
        <div>
          <h3>Hunter</h3>
          <div class="grid cols">
            ${hunter.map(i => renderItem(i, i.isClassItem ? "Exotic Hunter Class Item" : "Exotic Hunter Armor")).join("")}
          </div>
        </div>
        <div>
          <h3>Titan</h3>
          <div class="grid cols">
            ${titan.map(i => renderItem(i, i.isClassItem ? "Exotic Titan Class Item" : "Exotic Titan Armor")).join("")}
          </div>
        </div>
        <div>
          <h3>Warlock</h3>
          <div class="grid cols">
            ${warlock.map(i => renderItem(i, i.isClassItem ? "Exotic Warlock Class Item" : "Exotic Warlock Armor")).join("")}
          </div>
        </div>
      </div>

      <h2>Exotic Weapons</h2>
      <div class="grid cols">
        ${weapons.map(i => renderItem(i, i.type || "Exotic Weapon")).join("")}
      </div>

      <h2>Exotic Catalysts</h2>
      <div class="grid cols">
        ${catalysts.map(i => renderItem(i, i.weapon ? `Catalyst for ${i.weapon}` : "Exotic Catalyst")).join("")}
      </div>

      <p class="muted" style="margin-top:22px">
        Admin page: <code>/admin/xur-admin.html</code>
      </p>
    `;
  } catch (e) {
    root.textContent = "Inventory unavailable.";
    console.error(e);
  }
})();
</script>
</body>
</html>
