<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>What Is Xur Selling This Week?</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fff;
      color: #0f172a;
      margin: 0;
      padding: 32px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 48px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: #f1f5f9;
      flex-shrink: 0;
      object-fit: cover;
    }

    .name {
      font-weight: 600;
    }

    .sub {
      font-size: 13px;
      color: #64748b;
    }

    .error {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>

<h1>What Is Xur Selling This Week?</h1>
<div>Data source: <code>/data/xurCurrentInventory.json</code></div>

<div id="error" class="error" style="display:none"></div>

<h2>Exotic Armor</h2>
<div id="armor" class="grid"></div>

<h2>Exotic Weapons</h2>
<div id="weapons" class="grid"></div>

<script>
(async () => {
  try {
    const [inventoryRes, iconsRes] = await Promise.all([
      fetch("./data/xurCurrentInventory.json"),
      fetch("./data/xurIcons.json")
    ]);

    if (!inventoryRes.ok || !iconsRes.ok) {
      throw new Error("Failed to load data files");
    }

    const inventory = await inventoryRes.json();
    const icons = await iconsRes.json();

    const resolveIcon = (itemHash) => {
      return icons[itemHash] || "";
    };

    const render = (items, containerId) => {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      items.forEach(item => {
        const img = resolveIcon(item.itemHash);

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img class="icon" src="${img}" alt="${item.name}">
          <div>
            <div class="name">${item.name}</div>
            <div class="sub">${item.type || item.class || ""}</div>
          </div>
        `;

        container.appendChild(card);
      });
    };

    render(inventory.exoticArmor || [], "armor");
    render(inventory.exoticWeapons || [], "weapons");

  } catch (err) {
    const e = document.getElementById("error");
    e.style.display = "block";
    e.textContent = err.message;
  }
})();
</script>

</body>
</html>
